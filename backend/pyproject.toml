[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-net-hunter-backend"
version = "1.0.0"
description = "Ghost Net Hunter — Production sonar debris detection backend"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ────────────────────────────────────────
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── Database ─────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",

    # ── Task Queue ───────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # ── Schema Validation ────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── ML / Computer Vision ─────────────────────────────────
    "torch>=2.2.0",
    "ultralytics>=8.2.0",
    "opencv-python-headless>=4.9.0",
    "scikit-image>=0.23.0",
    "onnxruntime>=1.17.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",

    # ── Sonar I/O ────────────────────────────────────────────
    "pyxtf>=1.4.0",

    # ── Geospatial ───────────────────────────────────────────
    "pyproj>=3.6.0",
    "geopy>=2.4.0",

    # ── Observability ────────────────────────────────────────
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",

    # ── Security / Rate Limiting ─────────────────────────────
    "slowapi>=0.1.9",
    "python-magic>=0.4.27",

    # ── Utilities ────────────────────────────────────────────
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
]
tensorrt = [
    "tensorrt>=10.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "ICN", "PIE", "T20", "PT", "RET", "SIM", "TCH", "ARG", "ERA"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

